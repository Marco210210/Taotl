name: Web and Expo Go compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.example.test/ords/taotl_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run test:web
      - name: Verify native bundles for Expo Go
        run: TAOTL_EXPO_GO=1 npx expo export --platform ios --platform android --output-dir .local/web-native-check --max-workers 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: test-results/
