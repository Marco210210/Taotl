name: Build iOS

on:
  workflow_dispatch:

concurrency:
  group: taotl-ios-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Taotl iOS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Install dependencies
        run: npm ci

      - name: Start signed iOS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >
          npx eas-cli@latest build
          --platform ios
          --profile preview
          --non-interactive
          --no-wait
