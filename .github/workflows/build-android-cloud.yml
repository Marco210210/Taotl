name: Build Android APK (cloud, diagnostica)

on:
  workflow_dispatch:

concurrency:
  group: taotl-android-apk-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Taotl APK sui server Expo
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Install dependencies
        run: npm ci

      - name: Build APK on EAS cloud
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json > build-result.json
          cat build-result.json
          ARTIFACT_URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build-result.json','utf8'))[0].artifacts.buildUrl)")
          echo "Downloading $ARTIFACT_URL"
          curl -L -o taotl-preview-cloud.apk "$ARTIFACT_URL"
          ls -la taotl-preview-cloud.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taotl-preview-apk-cloud
          path: taotl-preview-cloud.apk
          if-no-files-found: error
          retention-days: 7
