name: Build Android APK

on:
  workflow_dispatch:

concurrency:
  group: taotl-android-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Taotl APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build signed APK locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >
          npx eas-cli@latest build
          --platform android
          --profile preview
          --local
          --non-interactive
          --output ./taotl-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taotl-preview-apk
          path: taotl-preview.apk
          if-no-files-found: error
          retention-days: 7
